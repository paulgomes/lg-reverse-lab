name: Offline tools
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q tools LG_REVERSE_LAB_EDITOR USB_SCOUT lab
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest discover -s USB_SCOUT/tests -p test_scout.py -v
